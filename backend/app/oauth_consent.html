<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; frame-ancestors 'none'; script-src 'self' https://esm.sh; style-src 'unsafe-inline'; connect-src 'self' https://byjmnvnojwssjswyeybj.supabase.co">
  <title>Autorizar acesso - ROTA GRM</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f5f9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 440px); box-sizing: border-box; padding: 28px; border-radius: 16px; background: white; box-shadow: 0 10px 34px #17203318; }
    h1 { margin-top: 0; font-size: 1.45rem; }
    p { line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #bac3d2; border-radius: 8px; font: inherit; }
    button { padding: 11px 16px; border: 0; border-radius: 8px; color: white; background: #155eef; font: inherit; font-weight: 650; cursor: pointer; }
    button.secondary { color: #344054; background: #eaecf0; }
    button:disabled { opacity: .55; cursor: wait; }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .muted { color: #596579; font-size: .94rem; }
    #error { color: #b42318; overflow-wrap: anywhere; }
    #consent, #error, #login { display: none; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <main id="app" data-supabase-url="__SUPABASE_URL__" data-publishable-key="__SUPABASE_PUBLISHABLE_KEY__">
    <h1>Entrar no ROTA GRM</h1>
    <p class="muted">Use uma conta autorizada pela equipe para acessar o painel operacional.</p>
    <form id="login">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div class="actions"><button id="login-button" type="submit">Entrar</button></div>
    </form>
    <section id="consent">
      <p><strong id="client-name">Aplicativo</strong> solicita acesso à sua conta.</p>
      <p class="muted">Redirecionamento: <span id="redirect-uri"></span></p>
      <p>Permissões solicitadas:</p>
      <ul id="scopes"></ul>
      <div class="actions">
        <button id="approve" type="button">Autorizar</button>
        <button id="deny" class="secondary" type="button">Recusar</button>
      </div>
    </section>
    <p id="error" role="alert"></p>
  </main>
  <script type="module" src="/oauth/consent.js"></script>
</body>
</html>
