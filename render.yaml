services:
  - type: web
    name: rota-grm-backend
    runtime: docker
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: URL_API_GRM
        sync: false
      - key: TOKEN_API_APONTAMENTOS_GRM_PUSH
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_URL
        value: https://byjmnvnojwssjswyeybj.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OIDC_ISSUER
        value: https://byjmnvnojwssjswyeybj.supabase.co/auth/v1
      - key: OIDC_AUDIENCE
        value: authenticated
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_ALLOWED_EMAILS
        sync: false
      # Trust forwarding headers only on Render's proxy-only container ingress.
      # For other hosting, replace * with the exact trusted proxy addresses.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: PGSSLROOTCERT
        value: /etc/secrets/supabase-ca.crt
      - key: SNAPSHOT_INTERVAL_SECONDS
        value: "60"
      - key: SNAPSHOT_STALE_SECONDS
        value: "120"
      - key: SNAPSHOT_RETENTION_DAYS
        value: "7"
      - key: FCM_ENABLED
        value: "false"
